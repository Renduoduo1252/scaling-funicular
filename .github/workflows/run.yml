    277 +def clean_text(value: str) -> str:
    278 +    value = html.unescape(value or "")
    279 +    value = re.sub(r"<[^>]+>", " ", value)
    280 +    value = re.sub(r"\s+", " ", value)
    281 +    return value.strip()
