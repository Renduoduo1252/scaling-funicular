    284 +def canonicalize_url(url: str) -> str:
    285 +    url = html.unescape((url or "").strip())
    286 +    parsed = urllib.parse.urlparse(url)
    287 +
    288 +    if parsed.netloc == "news.google.com" and parsed.path.startswith("/rss/articles/"):
    289 +        query = urllib.parse.parse_qs(parsed.query)
    290 +        if "url" in query and query["url"]:
    291 +            url = query["url"][0]
    292 +            parsed = urllib.parse.urlparse(url)
    293 +
    294 +    query_pairs = urllib.parse.parse_qsl(parsed.query, keep_blank_values=False)
    295 +    filtered_query = [
    296 +        (key, value)
    297 +        for key, value in query_pairs
    298 +        if not key.lower().startswith("utm_")
    299 +        and key.lower()
    300 +        not in {"from", "spm", "campaign", "source", "ref", "fbclid", "gclid"}
    301 +    ]
    302 +
    303 +    return urllib.parse.urlunparse(
    304 +        (
    305 +            parsed.scheme.lower() or "https",
    306 +            parsed.netloc.lower(),
    307 +            parsed.path.rstrip("/") or "/",
    308 +            "",
    309 +            urllib.parse.urlencode(filtered_query),
    310 +            "",
    311 +        )
    312 +    )
