    226 +def fetch_url(url: str) -> bytes:
    227 +    headers = {
    228 +        "User-Agent": random.choice(USER_AGENTS),
    229 +        "Accept": "application/rss+xml, application/xml;q=0.9, */*;q=0.8",
    230 +        "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.6",
    231 +        "Cache-Control": "no-cache",
    232 +    }
    233 +    request = urllib.request.Request(url, headers=headers)
    234 +
    235 +    last_error: Exception | None = None
    236 +    for attempt in range(3):
    237 +        try:
    238 +            with urllib.request.urlopen(request, timeout=REQUEST_TIMEOUT) as response:
    239 +                return response.read()
    240 +        except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as exc:
    241 +            last_error = exc
    242 +            backoff = (2 ** attempt) + random.uniform(0.5, 2.0)
    243 +            time.sleep(backoff)
    244 +
    245 +    raise RuntimeError(f"request failed after retries: {last_error}")
