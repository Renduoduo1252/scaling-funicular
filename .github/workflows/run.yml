    315 +def parse_datetime(value: str) -> str:
    316 +    value = (value or "").strip()
    317 +    if not value:
    318 +        return ""
    319 +
    320 +    try:
    321 +        parsed = parsedate_to_datetime(value)
    322 +        if parsed.tzinfo is None:
    323 +            parsed = parsed.replace(tzinfo=timezone.utc)
    324 +        return parsed.astimezone(timezone.utc).isoformat().replace("+00:00", "Z")
    325 +    except (TypeError, ValueError):
    326 +        return value
